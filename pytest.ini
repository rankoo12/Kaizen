# pytest.ini
[pytest]
# Root directory for pytest discovery
testpaths = engine/tests

# Register custom markers to avoid PytestUnknownMarkWarning
markers =
    contract: Fast API/CLI contract-level tests (routing, schema, plumbing)
    integration: Real service-level tests with ElementResolver or orchestrator
    e2e: Full system smoke tests using Playwright or CLI

# Display short test names only (optional, keeps output tidy)
addopts = -q
