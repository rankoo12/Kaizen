# pytest.ini — Kaizen Engine test configuration
[pytest]
minversion = 8.0
testpaths = engine/tests

# ----------------------------------------------------------------------
# Marker registration (prevents PytestUnknownMarkWarning)
# ----------------------------------------------------------------------
markers =
    contract: FastAPI/CLI contract-level tests (routing, schema, plumbing)
    integration: Real service-level tests with ElementResolver or orchestrator
    e2e: Full system smoke tests using Playwright or CLI

# ----------------------------------------------------------------------
# Default options
# -q : short test names (cleaner CI logs)
# Add -vv locally for detailed output (set PYTEST_OPTS='-vv')
# ----------------------------------------------------------------------
addopts = -q
