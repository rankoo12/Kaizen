{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaizen.fullname" . }}-otel-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      logging: {}
      prometheus:
        endpoint: 0.0.0.0:9464
      otlp:
        endpoint: http://jaeger:4318
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaizen.fullname" . }}-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: kaizen
    spec:
      containers:
        - name: otelcol
          image: {{ .Values.otelCollector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: {{ .Values.otelCollector.port }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
      volumes:
        - name: otel-config
          configMap:
            name: {{ include "kaizen.fullname" . }}-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaizen.fullname" . }}-otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: http
      port: 4318
      targetPort: {{ .Values.otelCollector.port }}
{{- end }}
