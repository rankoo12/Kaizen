{{- if .Values.hpa.runner.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kaizen.fullname" . }}-engine-runner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kaizen.fullname" . }}-engine-runner
  minReplicas: {{ .Values.hpa.runner.minReplicas }}
  maxReplicas: {{ .Values.hpa.runner.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.runner.targetCPUUtilizationPercentage }}
{{- end }}
