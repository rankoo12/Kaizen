x-default-limits: &default-limits
  mem_limit: 0.3g
services:
  postgres:
    image: postgres:16
    container_name: kaizen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaizen
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen -d kaizen"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kaizen
  engine-api:
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: ..
      dockerfile: engine/Dockerfile
    image: kaizen-engine:dev
    container_name: kaizen-engine-api
    working_dir: /app

    # Keep some safety, but allow normal installs
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    # read_only: true           # DISABLED for dev to let pip & wheels work
    tmpfs:
      - /tmp:size=512m,mode=1777

    # NOTE: compose file is in infra/, mount repo root via ..
    volumes:
      - ..:/app:ro
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../snapshots:/app/snapshots

    ports:
      - "8080:8080"

    environment:
      KAIZEN_VISUAL_TOLERANCE: "0.0025"
      KAIZEN_HEALER_DEPTH: "2"
      KAIZEN_HEALER_ENABLED: "true"
      KAIZEN_HEALER_PATH: "deterministic"
      # Use browsers preinstalled in the Playwright base image
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      KAIZEN_STORAGE_BACKEND: "postgres"
      KAIZEN_PG_DSN: "postgresql://kaizen:kaizen@postgres:5432/kaizen"
      # LLM disabled by default (enable later to use your local Ollama)
      KAIZEN_LLM_ENABLED: "true"
      KAIZEN_PLANNER_PATH: "llm"
      KAIZEN_ALLOWED_URL_SCHEMES: "https://,http://,about:blank,data:,https://httpbin.org/forms/post"
      KAIZEN_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      KAIZEN_OLLAMA_MODEL: qwen3:8b
      KAIZEN_LLM_TIMEOUT_SECONDS: 60

    # Use app image entrypoint (uvicorn from Dockerfile). To see access logs, set log-level to info and drop --no-access-log in Dockerfile or override here.
    command: ["uvicorn", "engine.api.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080", "--log-level", "warning", "--no-access-log"]

    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request\ntry:\n  urllib.request.urlopen('http://127.0.0.1:8080/api/docs', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s

    restart: unless-stopped
    networks:
      - kaizen
  engine-runner:
    image: kaizen-engine:dev
    container_name: kaizen-engine-runner
    working_dir: /app
    depends_on:
      engine-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Allow apt-get to run by keeping default capabilities
    # (dropping all caps breaks setuid/setgid/chown inside apt)
    # security_opt and cap_drop intentionally omitted for this runner
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ..:/app:rw
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../snapshots:/app/snapshots
    environment:
      PYTHONUNBUFFERED: "1"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      KAIZEN_API_BASE: "http://engine-api:8080/api"
      PYTHONWARNINGS: "ignore"
      KAIZEN_HEALER_ENABLED: "true"
      KAIZEN_HEALER_PATH: "deterministic"
      KAIZEN_STORAGE_BACKEND: "postgres"
      KAIZEN_PG_DSN: "postgresql://kaizen:kaizen@postgres:5432/kaizen"
      # LLM disabled by default (enable later to use your local Ollama)
      KAIZEN_LLM_ENABLED: "true"
      KAIZEN_PLANNER_PATH: "llm"
      KAIZEN_ALLOWED_URL_SCHEMES: "https://,http://,about:blank,data:,https://httpbin.org/forms/post"
      KAIZEN_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      KAIZEN_OLLAMA_MODEL: qwen3:8b
      KAIZEN_LLM_TIMEOUT_SECONDS: 60
    command: ["python", "-m", "engine.runner"]
    networks:
      - kaizen
  portal:
    image: python:3.11-slim
    container_name: kaizen-portal
    working_dir: /app/portal/backend
    depends_on:
      engine-api:
        condition: service_healthy
    volumes:
      - ..:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      ENGINE_API_BASE: "http://engine-api:8080/api"
      PYTHONWARNINGS: "ignore"
    ports:
      - "8081:8080"
    command: >
      bash -lc '
        set -e;
        pip install --no-cache-dir -U pip;
        # Install runtime deps directly (no build-backend needed)
        pip install --no-cache-dir fastapi uvicorn pydantic httpx;
        uvicorn api:app --host 0.0.0.0 --port 8080 --log-level warning --no-access-log
      '
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request\ntry:\n  urllib.request.urlopen('http://127.0.0.1:8080', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - kaizen

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ../logs:/var/log/kaizen:ro
    ports:
      - "4318:4318"    # OTLP HTTP receiver
      - "9464:9464"    # Prometheus exporter endpoint
    restart: unless-stopped
    networks:
      - kaizen

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_GRPC_HOST_PORT: "0.0.0.0:4317"
      COLLECTOR_OTLP_HTTP_HOST_PORT: "0.0.0.0:4318"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC ingest for collector exporter
    restart: unless-stopped
    networks:
      - kaizen

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - kaizen

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - kaizen

networks:
  kaizen:
    driver: bridge

volumes:
  pgdata: {}
