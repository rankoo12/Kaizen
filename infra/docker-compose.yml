services:
  engine-api:
    image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
    container_name: kaizen-engine-api
    working_dir: /app

    # Keep some safety, but allow normal installs
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    # read_only: true           # DISABLED for dev to let pip & wheels work
    tmpfs:
      - /tmp:size=512m,mode=1777

    # NOTE: compose file is in infra/, mount repo root via ..
    volumes:
      - ..:/app:ro
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../snapshots:/app/snapshots

    ports:
      - "8080:8080"

    environment:
      KAIZEN_VISUAL_TOLERANCE: "0.0025"
      KAIZEN_HEALER_DEPTH: "2"
      # Use browsers preinstalled in the Playwright base image
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

    command: >
      bash -lc '
        set -e;
        pip install --no-cache-dir -r requirements.txt;
        # Use factory mode so uvicorn calls create_app()
        uvicorn engine.api.server:create_app --factory --host 0.0.0.0 --port 8080 --log-level warning --no-access-log
      '

    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request\ntry:\n  urllib.request.urlopen('http://127.0.0.1:8080/api/docs', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s

    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - kaizen
  engine-runner:
    image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
    container_name: kaizen-engine-runner
    working_dir: /app
    depends_on:
      engine-api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # Allow apt-get to run by keeping default capabilities
    # (dropping all caps breaks setuid/setgid/chown inside apt)
    # security_opt and cap_drop intentionally omitted for this runner
    user: "0:0"
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ..:/app:rw
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../snapshots:/app/snapshots
    environment:
      PYTHONUNBUFFERED: "1"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      KAIZEN_API_BASE: "http://engine-api:8080/api"
      PYTHONWARNINGS: "ignore"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    command: >
      bash -lc '
        set -euo pipefail;
        export DEBIAN_FRONTEND=noninteractive;
        apt-get update;
        apt-get install -y --no-install-recommends ca-certificates;
        rm -rf /var/lib/apt/lists/*;
        python -m pip install -U pip;
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi;
        # Playwright runtime is in base image; install deps and chromium only if needed
        python -m playwright install-deps || true;
        python -m playwright install chromium || true;
        mkdir -p reports logs snapshots;
        python -m engine.runner
      '
    networks:
      - kaizen
  portal:
    image: python:3.11-slim
    container_name: kaizen-portal
    working_dir: /app/portal/backend
    depends_on:
      engine-api:
        condition: service_healthy
    volumes:
      - ..:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      ENGINE_API_BASE: "http://engine-api:8080/api"
      PYTHONWARNINGS: "ignore"
    ports:
      - "8081:8080"
    command: >
      bash -lc '
        set -e;
        pip install --no-cache-dir -U pip;
        # Install runtime deps directly (no build-backend needed)
        pip install --no-cache-dir fastapi uvicorn pydantic httpx;
        uvicorn api:app --host 0.0.0.0 --port 8080 --log-level warning --no-access-log
      '
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request\ntry:\n  urllib.request.urlopen('http://127.0.0.1:8080', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - kaizen

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"    # OTLP HTTP receiver
      - "9464:9464"    # Prometheus exporter endpoint
    restart: unless-stopped
    networks:
      - kaizen

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC ingest for collector exporter
    restart: unless-stopped
    networks:
      - kaizen

networks:
  kaizen:
    driver: bridge
